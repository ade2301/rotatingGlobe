<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E.B. Media — K.E.L.M. 101.9</title>
    <meta name="description" content="E.B. Media · K.E.L.M. 101.9 Radio — A journey from Chicago/Gary to Los Angeles and London. Interactive globe visualising the global footprint of BRAY Magazine and Digital Streaming." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --cream-top: #fdfaf2;
            --cream-bottom: #f8f2e4;
            --gold-light: #dbc46d;
            --gold-mid: #d9c06e;
            --gold-deep: #cfb55f;
            --teal: #2d8f91;        /* true brand teal — brighter, not hunter green */
            --teal-dark: #1f6e70;   /* darker teal, not olive/hunter */
            --teal-mid:  #3aa0a2;   /* mid teal for gradients */
            --ivory: #fdfaf2;       /* pure ivory */
            --text: #231f1a;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100dvh;
            height: 100vh; /* fallback */
        }

        body {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--cream-bottom);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        /* ── Poster layout ──────────────────────────────────────── */
        .poster {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.92), transparent 55%),
                linear-gradient(180deg, var(--cream-top) 0%, var(--cream-bottom) 100%);
        }

        /* ── Background decorative layers ───────────────────────── */
        .poster__top,
        .poster__band,
        .poster__bottom {
            position: absolute;
            left: 0;
            right: 0;
            pointer-events: none;
        }

        .poster__top {
            top: 0;
            height: 42%;
            background: linear-gradient(180deg, #fffdf9 0%, #f9f4e9 100%);
        }

        .poster__band {
            top: 42%;
            height: 32%;
            background:
                linear-gradient(180deg,
                    rgba(15, 100, 105, 0.68) 0%,
                    rgba(25, 120, 125, 0.38) 12%,
                    rgba(35, 138, 142, 0.12) 30%,
                    rgba(35, 138, 142, 0.00) 50%,
                    rgba(35, 138, 142, 0.12) 70%,
                    rgba(25, 120, 125, 0.36) 88%,
                    rgba(15, 100, 105, 0.66) 100%),
                linear-gradient(180deg,
                    var(--gold-light) 0%,
                    var(--gold-mid) 45%,
                    var(--gold-deep) 100%);
            box-shadow:
                inset 0 3px 0 rgba(255, 255, 255, 0.28),
                inset 0 -3px 0 rgba(255, 255, 255, 0.18),
                inset 0 28px 40px rgba(12, 90, 92, 0.20),
                inset 0 -28px 40px rgba(12, 90, 92, 0.18);
        }

        /* Teal border lines */
        .poster__band::before,
        .poster__band::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            height: 5px;
            background: linear-gradient(180deg, #5bbfc2 0%, var(--teal) 55%, #1f7a7c 100%);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.22),
                0 0 14px rgba(45, 143, 145, 0.35),
                0 0 32px rgba(45, 143, 145, 0.14);
        }
        .poster__band::before { top: 0; }
        .poster__band::after  { bottom: 0; }

        .poster__bottom {
            bottom: 0;
            height: 16%;
            background: linear-gradient(180deg, #fbf8ef 0%, #f7f1e3 100%);
        }

        /* ── Content layer ───────────────────────────────────────── */
        .poster__content {
            position: absolute;
            inset: 0;
            z-index: 2;
        }

        /* ── Globe scene ─────────────────────────────────────────── */
        .globe-scene {
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            width: clamp(240px, min(46vw, 64vh), 760px);
            aspect-ratio: 1;
            z-index: 2;
        }

        /* ── Brand copy — pinned to bottom of poster ── */
        .brand-copy {
            position: absolute;
            bottom: clamp(14px, 3vh, 40px);
            left: 50%;
            transform: translateX(-50%);
            width: clamp(220px, 88vw, 600px);
            text-align: center;
            z-index: 4;
        }

        /* Soft elliptical shadow grounding the globe onto the band below */
        .globe-scene__shadow {
            position: absolute;
            left: 50%;
            top: 100%;
            width: 76%;
            height: 14%;
            transform: translate(-50%, -38%);
            background: radial-gradient(ellipse at center, rgba(15, 40, 45, 0.38) 0%, rgba(15, 40, 45, 0) 75%);
            filter: blur(6px);
            pointer-events: none;
            z-index: 1;
        }

        .globe-scene__glow {
            position: absolute;
            inset: -14%;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(45, 143, 145, 0.18) 0%,
                rgba(219, 196, 109, 0.16) 40%,
                transparent 68%);
            filter: blur(30px);
            animation: glowPulse 5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes glowPulse {

            0%,
            100% {
                opacity: 0.65;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        /* Orbit rings */
        .globe-scene__orbit {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .globe-scene__orbit::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 244, 210, 0.65);
        }

        .globe-scene__orbit--a {
            inset: -4%;
            animation: orbitSpin 20s linear infinite;
        }

        .globe-scene__orbit--b {
            inset: -7%;
            opacity: 0.5;
            animation: orbitSpin 32s linear infinite reverse;
        }

        @keyframes orbitSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* ── The globe div (Three.js renders inside here) ─────────── */
        .globe {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            background: #06161e;
            box-shadow:
                0 44px 72px rgba(10, 6, 2, 0.52),
                0 16px 32px rgba(10, 6, 2, 0.28),
                0 0 0 7px rgba(253, 250, 242, 0.82),
                0 0 0 16px rgba(219, 196, 109, 0.20),
                inset 0 0 0 1px rgba(255, 255, 255, 0.70),
                inset -22px -30px 64px rgba(4, 4, 4, 0.38);
        }

        /* Ring highlight overlay (sits above the canvas) */
        .globe__ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 7px rgba(253, 250, 242, 0.92),  /* ivory */
                inset -6px -10px 28px rgba(130, 110, 80, 0.20),
                inset 8px 8px 28px rgba(255, 255, 255, 0.55);
            pointer-events: none;
            z-index: 10;
        }

        /* Cinematic vignette overlay on the globe canvas */
        .globe__vignette {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%,
                transparent 30%,
                rgba(4, 14, 20, 0.12) 52%,
                rgba(4, 12, 18, 0.38) 72%,
                rgba(3, 9, 14, 0.68) 88%,
                rgba(2, 6, 10, 0.85) 100%);
            pointer-events: none;
            z-index: 9;
        }

        /* Cinematic specular highlight — simulates glossy surface reflection
           from key light upper-left, soft and premium not harsh             */
        .globe__specular {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(ellipse 55% 45% at 32% 28%,
                rgba(255, 252, 240, 0.22) 0%,
                rgba(255, 248, 225, 0.10) 35%,
                transparent 65%);
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: screen;
        }

        /* CSS post-processing on the Three.js canvas:
           contrast lift + subtle saturation boost for colour grading.
           image-rendering: auto tells the browser to use bilinear smoothing
           when the canvas is scaled by devicePixelRatio — this reduces the
           jagged "pixelated" look on mid-range phones with imperfect GPU AA. */
        .globe canvas {
            filter: contrast(1.12) saturate(1.18) brightness(1.04);
            image-rendering: auto;
            -webkit-font-smoothing: antialiased;
        }
        .globe-scene__labels {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 12;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.45));
        }

        /* ── Sparks ──────────────────────────────────────────────── */
        .spark {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, #fffce8 0%, #ffe475 28%, rgba(255, 210, 90, 0.06) 70%, transparent 78%);
            box-shadow: 0 0 14px rgba(255, 218, 100, 0.9), 0 0 34px rgba(255, 198, 60, 0.3);
            opacity: 0;
            pointer-events: none;
            z-index: 12;
        }

        .spark::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2px;
            height: 80px;
            transform: translate(-50%, -100%);
            background: linear-gradient(180deg, rgba(255, 248, 210, 0.9), rgba(255, 210, 90, 0.02));
            filter: blur(1px);
            opacity: 0.45;
        }

        .spark--1 {
            left: 8%;
            top: 36%;
            animation: sparkFloat 3.8s 0.0s ease-in-out infinite;
        }

        .spark--2 {
            left: 24%;
            top: 11%;
            animation: sparkFloat 4.2s 0.8s ease-in-out infinite;
        }

        .spark--3 {
            right: 18%;
            top: 11%;
            animation: sparkFloat 3.5s 1.5s ease-in-out infinite;
        }

        .spark--4 {
            right: 8%;
            top: 40%;
            animation: sparkFloat 4.7s 0.4s ease-in-out infinite;
        }

        .spark--5 {
            left: 50%;
            bottom: 6%;
            transform: translateX(-50%);
            animation: sparkFloat 4.1s 2.0s ease-in-out infinite;
        }

        @keyframes sparkFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }

            18% {
                opacity: 0.92;
                transform: translateY(-5px) scale(1);
            }

            65% {
                opacity: 0.7;
                transform: translateY(-16px) scale(0.9);
            }

            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.4);
            }
        }

        /* ── Brand copy ──────────────────────────────────────────── */

        .brand-copy__eyebrow {
            font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif;
            font-size: clamp(1.8rem, 6vw, 3.1rem);
            color: #1f8082;   /* true teal, not hunter green */
            font-weight: 400;
            margin-bottom: 2px;
        }

        .brand-copy__text h1 {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(1.3rem, 4.5vw, 2.4rem);
            line-height: 0.9;
            letter-spacing: -0.01em;
            font-weight: 700;
            color: #1f7476;  /* true teal, not hunter */
        }

        .brand-copy__text p {
            margin: 5px 0 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(0.78rem, 2.5vw, 0.95rem);
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(120, 100, 62, 0.82);
        }

        .accent {
            color: #c79a3e;
        }

        .brand-copy__row {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transform: translateX(-6px);
        }

        /* Mic icon */
        .mic {
            position: relative;
            width: 24px;
            height: 40px;
            flex: 0 0 auto;
            filter: drop-shadow(0 0 7px rgba(255, 210, 95, 0.4));
        }

        .mic__head,
        .mic__body,
        .mic__stand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #fff3cd 0%, #ffd96e 30%, #c98a15 100%);
        }

        .mic__head {
            top: 0;
            width: 22px;
            height: 22px;
            border-radius: 12px 12px 10px 10px;
        }

        .mic__body {
            top: 18px;
            width: 11px;
            height: 15px;
            border-radius: 6px;
        }

        .mic__stand {
            bottom: 0;
            width: 4px;
            height: 13px;
            border-radius: 999px;
        }

        .mic__stand::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -5px;
            width: 16px;
            height: 4px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(251, 226, 160, 0.9), transparent);
        }

        .mic__head::before {
            content: "";
            position: absolute;
            inset: 5px 5px 7px;
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.30), transparent);
        }

        .brand-copy__text {
            text-align: left;
        }

        .brand-copy__bar {
            margin-top: 11px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg,
                    rgba(209, 170, 78, 0),
                    rgba(244, 220, 148, 0.97),
                    rgba(209, 170, 78, 0));
        }

        /* ── Poster-level contrast / colour grade via CSS filter ─────── */
        .poster {
            filter: contrast(1.06) saturate(1.10);
        }
        /* Landscape phones: shrink globe so both globe + badge fit */
        @media (max-height: 500px) {
            .globe-scene {
                width: clamp(120px, 34vh, 220px);
            }
            .brand-copy__eyebrow { font-size: 1.3rem; }
            .brand-copy__text h1  { font-size: 1.1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }


        /* ── Intro animation ──────────────────────────────────────── */
        /* Animate the whole content block in, not individual pieces that
           have tap-targets depending on stable pixel dimensions.         */
        .poster__band {
            transform-origin: center;
            transform: scaleX(0);
        }

        .poster__content {
            opacity: 0;
            transform: translateY(14px);
        }

        body.intro-ready .poster__band {
            animation: bandSpread 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0s forwards;
        }

        body.intro-ready .poster__content {
            animation: contentReveal 0.9s cubic-bezier(0.34, 1.2, 0.64, 1) 0.5s forwards;
        }

        @keyframes bandSpread {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0);    }
        }





        /* ── Typewriter & brand text animations ───────────────────── */

        /* Eyebrow: keep the Great Vibes font, hide accent color initially —
   the JS will inject plain text so we re-apply the accent via JS */
        .brand-copy__eyebrow .tw-inner {
            font-family: "Great Vibes", "Cormorant Garamond", Georgia, serif;
            font-size: inherit;
            color: #1f8082;  /* true brand teal */
            font-weight: 400;
        }

        /* Blinking cursor */
        .tw-cursor {
            display: inline-block;
            font-weight: 300;
            opacity: 1;
            animation: twBlink 0.75s step-end infinite;
            color: #c79a3e;
            margin-left: 1px;
        }

        .tw-cursor.tw-done {
            animation: twFadeOut 0.4s 0.8s forwards;
        }

        @keyframes twBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @keyframes twFadeOut {
            to {
                opacity: 0;
            }
        }

        /* Mic hover-reveal effect:
    mic slides down from above and settles, timed to when
    the h1 typewriter starts so it looks like it's "arriving" */
        .mic--animate {
            opacity: 0;
            transform: translateY(-18px);
            animation: micDrop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 3.0s forwards;
            filter: drop-shadow(0 0 0px rgba(255, 210, 95, 0));
        }

        @keyframes micDrop {
            0% {
                opacity: 0;
                transform: translateY(-18px);
                filter: drop-shadow(0 0 0px rgba(255, 210, 95, 0));
            }

            60% {
                opacity: 1;
                transform: translateY(3px);
                filter: drop-shadow(0 0 10px rgba(255, 210, 95, 0.7));
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: drop-shadow(0 0 7px rgba(255, 210, 95, 0.4));
            }
        }

        /* Gold bar wipe-in from left */
        .brand-copy__bar--animate {
            transform-origin: left center;
            transform: scaleX(0);
            opacity: 0;
            animation: barWipe 0.7s ease 4.6s forwards;
        }

        @keyframes barWipe {
            from {
                transform: scaleX(0);
                opacity: 0;
            }

            to {
                transform: scaleX(1);
                opacity: 1;
            }
        }

        .poster::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                    transparent 55%,
                    rgba(10, 20, 15, 0.45) 100%);
            z-index: 20;
        }

        #loader-overlay {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        #loader-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* ── Marker tap targets (projected HTML overlays) ────────── */
        .marker-tap {
            position: absolute;
            width: 68px;
            height: 68px;
            margin-left: -34px;
            margin-top: -34px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 15;
            /* Invisible but interactive */
            background: transparent;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }

        .marker-tap:focus {
            outline: 2px solid var(--gold-light);
            outline-offset: 2px;
        }
        .globe-tooltip {
            position: absolute;
            pointer-events: none;
            z-index: 50;
            min-width: 170px;
            max-width: 230px;
            padding: 10px 14px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(30, 130, 135, 0.96), rgba(18, 100, 106, 0.96));
            border: 1.5px solid var(--gold-light);
            box-shadow: 0 8px 24px rgba(0,0,0,0.38), 0 0 20px rgba(219,196,109,0.28);
            color: var(--ivory);
            font-family: Arial, Helvetica, sans-serif;
            opacity: 0;
            transform: translate(-50%, calc(-100% - 14px)) scale(0.92);
            transition: opacity 0.22s ease, transform 0.22s ease;
            top: 0;
            left: 0;
        }

        .globe-tooltip.is-visible {
            opacity: 1;
            transform: translate(-50%, calc(-100% - 18px)) scale(1);
        }

        .globe-tooltip.tooltip--below {
            transform: translate(-50%, 18px) scale(0.92);
        }

        .globe-tooltip.tooltip--below.is-visible {
            transform: translate(-50%, 18px) scale(1);
        }

        .globe-tooltip.tooltip--below::after {
            top: -7px;
            bottom: auto;
            border-top: none;
            border-bottom: 7px solid var(--gold-light);
        }

        /* ── Location info modal ────────────────────────────────── */
        .location-modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: rgba(15, 40, 40, 0.55);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.28s ease;
        }

        .location-modal-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .location-modal {
            position: relative;
            width: min(86vw, 360px);
            padding: 28px 24px 24px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(35, 142, 148, 0.97), rgba(22, 110, 116, 0.97));
            border: 2px solid var(--gold-light);
            box-shadow: 0 20px 60px rgba(0,0,0,0.48), 0 0 36px rgba(219,196,109,0.32);
            color: var(--ivory);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            transform: translateY(16px) scale(0.96);
            transition: transform 0.28s cubic-bezier(0.34, 1.46, 0.64, 1);
        }

        .location-modal-overlay.is-open .location-modal {
            transform: translateY(0) scale(1);
        }

        .location-modal__close {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--gold-light);
            background: rgba(0,0,0,0.18);
            color: var(--gold-light);
            font-size: 1.1rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .location-modal__close:hover {
            background: rgba(219,196,109,0.18);
        }

        .location-modal__title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gold-light);
            margin: 4px 0 6px;
            letter-spacing: 0.02em;
        }

        .location-modal__role {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fbf8ef;
            margin-bottom: 10px;
        }

        .location-modal__info {
            font-size: 0.88rem;
            line-height: 1.5;
            color: rgba(251,248,239,0.88);
        }

        .location-modal__bar {
            width: 56px;
            height: 3px;
            margin: 14px auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--teal-mid), var(--gold-light));
        }

        .globe-tooltip__title {
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.03em;
            color: var(--gold-light);
            margin-bottom: 2px;
        }

        .globe-tooltip__role {
            font-size: 0.78rem;
            font-weight: 600;
            color: #fbf8ef;
            margin-bottom: 4px;
        }

        .globe-tooltip__info {
            font-size: 0.74rem;
            line-height: 1.35;
            color: rgba(251,248,239,0.85);
        }

        .globe-tooltip::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -7px;
            transform: translateX(-50%);
            width: 0; height: 0;

    <script>
        (function () {
            // Typewriter engine
            // Reads data-text and data-delay from each .typewriter element
            // data-delay = ms after page load before typing starts

            function typewrite(el) {
                const target = el.dataset.text || '';
                const delay = parseInt(el.dataset.delay) || 0;
                const inner = el.querySelector('.tw-inner');
                const cursor = el.querySelector('.tw-cursor');
                const speed = 52; // ms per character

                // For the eyebrow, re-inject the accent span mid-type
                const isEyebrow = el.closest('.brand-copy__eyebrow') !== null;

                setTimeout(function () {
                    let i = 0;
                    const interval = setInterval(function () {
                        i++;
                        const slice = target.slice(0, i);

                        if (isEyebrow) {
                            // "Ell B. Media" — make the "B." gold
                            const formatted = slice
                                .replace(/B\./g, '<span style="color:#c79a3e">B.</span>');
                            inner.innerHTML = formatted;
                        } else {
                            inner.textContent = slice;
                        }

                        if (i >= target.length) {
                            clearInterval(interval);
                            cursor.classList.add('tw-done');
                        }
                    }, speed);
                }, delay);
            }

            // Wait for page load then initialise all typewriters
            window.addEventListener('load', function () {
                document.querySelectorAll('.typewriter').forEach(typewrite);
            });
        })();
    </script>

            const EXTERNALS = [

            function loadScript(src, cb) {

            function boot() {
                const globeEl = document.getElementById('globe');
                if (!globeEl) return;

                // getBoundingClientRect is affected by CSS transforms (scale/translate).
                // The .globe-scene parent starts at scale(0.92) before the intro plays,
                // so we must read from the SCENE element's offsetWidth which is the
                // true layout size regardless of transforms.
                const sceneEl = globeEl.closest('.globe-scene') || globeEl.parentElement;

                function getSize() {
                    // offsetWidth/Height = CSS layout size, unaffected by transform.
                    const w = sceneEl ? sceneEl.offsetWidth  : globeEl.offsetWidth;
                    const h = sceneEl ? sceneEl.offsetHeight : globeEl.offsetHeight;
                    return {
                        w: w || 400,
                        h: h || 400
                    };
                }

                renderer.setSize(w, h);
                renderer.physicallyCorrectLights = true;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.22;
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.domElement.style.cssText =
                    'position:absolute;inset:0;width:100%;height:100%;border-radius:50%;display:block;z-index:1;pointer-events:auto;touch-action:none;';
                globeEl.insertBefore(renderer.domElement, globeEl.firstChild);

                // ── Scene ─────────────────────────────────────────────
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
                camera.position.z = 2.6;

                const tiltGroup = new THREE.Group();
                tiltGroup.rotation.z = TILT;
                scene.add(tiltGroup);

                // ── Build panoramic blended texture ──────────────────
                // Canvas: 4096×2048 — 6 image slots arranged left→right
                // Slot layout (each = 1/6 width of canvas):
                //   0: Chicago skyline (external)
                //   1: Griffith Obs + family (personal)
                //   2: LA coast sunset (external)
                //   3: LA family skyline (personal)
                //   4: Milky way / night (external)
                //   5: Chicago lake aerial (external)
                //
                // Between every slot we apply a wide cosine-blend so images
                // dissolve into each other — no hard seam visible.

                const TW = 4096, TH = 2048;
                const offC = document.createElement('canvas');
                offC.width = TW; offC.height = TH;

                // This is the colour that bleeds through wherever image slots
                // fade to transparent at their blended edges, so it must
                // sit firmly in the teal palette.
                const baseFill = oc.createLinearGradient(0, 0, 0, TH);
                baseFill.addColorStop(0,    '#07232c');  // very dark teal near poles
                baseFill.addColorStop(0.35, '#0c3b45');  // deep brand teal
                baseFill.addColorStop(0.5,  '#0f434e');  // richest teal at equator
                baseFill.addColorStop(0.65, '#0c3b45');
                baseFill.addColorStop(1,    '#07232c');

                // over 4 without hurting performance on desktop.
                texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

                const SLOTS = [
                    {
                        src: EXTERNALS[5],       // Mirror at start to seal left seam
                        x: 0, w: TW * 0.125
                    },
                    {
                        src: EXTERNALS[0],   // Chicago skyline done
                        x: TW * 0.125, w: TW * 0.125
                    },
                    {
                        src: EXTERNALS[4], // Griffith Obs (personal) done
                        x: TW * 0.25, w: TW * 0.125
                    },
                    {
                        src: EXTERNALS[3],   // Sunset coast done
                        x: TW * 0.375, w: TW * 0.125
                    },
                    {
                        src: PHOTO_LA_FAM,   // LA family (personal)
                        x: TW * 0.50, w: TW * 0.125
                    },
                    {
                        src: EXTERNALS[1],   // LA night city
                        x: TW * 0.625, w: TW * 0.125
                    },
                    {
                        src: EXTERNALS[2],   // Milky way
                        x: TW * 0.75, w: TW * 0.125

                // Outer limb glow shell — warm gold halo, BackSide creates the rim
                tiltGroup.add(new THREE.Mesh(
                    new THREE.SphereGeometry(1.10, 48, 48),
                    new THREE.MeshStandardMaterial({
                        color: 0xffe090, transparent: true, opacity: 0.055,
                        side: THREE.BackSide, depthWrite: false, roughness: 1, metalness: 0,
                    })
                ));

                // ── Lat/lon grid lines ────────────────────────────────
                // Meridians: glow near poles (|lat| > ~65°), fade at surface to not
                // obscure image slots. Parallels stay very subtle throughout.
                const lineGroup = new THREE.Group();
                tiltGroup.add(lineGroup);

                // Helper: build a vertex-coloured line so each point can fade independently
                function makeGradientLine(pts, alphaFn) {
                    const geo = new THREE.BufferGeometry().setFromPoints(pts);
                    const count = pts.length;
                    const colors = new Float32Array(count * 3);
                    const alphas = new Float32Array(count);
                    for (let i = 0; i < count; i++) {
                        // ivory teal-white tint
                        colors[i * 3]     = 0.98;
                        colors[i * 3 + 1] = 0.97;
                        colors[i * 3 + 2] = 0.94;
                        alphas[i] = alphaFn(i, count);
                    }
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    // Store alphas for use in material (LineBasicMaterial uses vertex colors)
                    // We bake alpha into colour brightness instead (no per-vertex alpha in basic)
                    for (let i = 0; i < count; i++) {
                        const a = alphas[i];
                        colors[i * 3]     *= a;
                        colors[i * 3 + 1] *= a;
                        colors[i * 3 + 2] *= a;
                    }
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    const mat = new THREE.LineBasicMaterial({
                        vertexColors: true, transparent: true, opacity: 1,
                        depthWrite: false,
                    });
                    return new THREE.Line(geo, mat);
                }

                // Parallels — flat subtle ivory, no polar emphasis needed
                [-60, -30, 0, 30, 60].forEach(latDeg => {
                    const lat = latDeg * Math.PI / 180;
                    const r = Math.cos(lat), y = Math.sin(lat);
                    const pts = Array.from({ length: 65 }, (_, i) => {
                        const a = (i / 64) * Math.PI * 2;
                        return new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
                    });
                    // Subtle uniform opacity — doesn't compete with image slots
                    lineGroup.add(makeGradientLine(pts, () => 0.13));
                });

                // Meridians — glow (opacity ~0.72) in the 25° caps near each pole,
                // then smoothly fade to near-invisible (0.06) over the mid-latitude band
                // so they don't clutter the scenic image slots on the equatorial belt.
                for (let lon = 0; lon < 360; lon += 30) {
                    const l = lon * Math.PI / 180;
                    const NPTS = 129;
                    const pts = Array.from({ length: NPTS }, (_, i) => {
                        const lat = (i / (NPTS - 1)) * Math.PI * 2 - Math.PI;
                        return new THREE.Vector3(Math.cos(lat) * Math.cos(l), Math.sin(lat), Math.cos(lat) * Math.sin(l));
                    });
                    lineGroup.add(makeGradientLine(pts, (i, count) => {
                        // lat in radians: maps i=0 → -π, i=count-1 → +π
                        const lat = (i / (count - 1)) * Math.PI * 2 - Math.PI;
                        const absLat = Math.abs(lat);
                        // Pole cap: |lat| > 65° → bright glow
                        const POLE_START = 65 * Math.PI / 180;   // start of glow region
                        const POLE_END   = 90 * Math.PI / 180;   // true pole = max glow
                        const MID_FADE   = 30 * Math.PI / 180;   // mid-latitude = minimum
                        if (absLat >= POLE_START) {
                            // Ramp from 0.22 at POLE_START up to 0.72 at pole
                            const t = (absLat - POLE_START) / (POLE_END - POLE_START);
                            return 0.22 + t * 0.50;
                        } else if (absLat >= MID_FADE) {
                            // Fade down from 0.22 at POLE_START to 0.06 at MID_FADE
                            const t = (absLat - MID_FADE) / (POLE_START - MID_FADE);
                            return 0.06 + t * 0.16;
                        } else {
                            // Equatorial band — very faint so images show clearly
                            return 0.06;
                        }
                    }));
                }

                // ── Location markers (golden glowing mic pins) ─────────
                // Positions are hand-placed in a front-facing arc so all
                // three markers stay visible during the pendulum swing,
                // rather than using literal lat/lon (which can land on
                // the far side of this stylized panoramic texture).
                function frontVec3(xDeg, yDeg, radius) {
                    // xDeg/yDeg = angular offset from the camera-facing
                    // center point (+Z), small angles keep markers on
                    // the visible hemisphere.
                    const x = xDeg * Math.PI / 180;
                    const y = yDeg * Math.PI / 180;
                    const dir = new THREE.Vector3(Math.sin(x), Math.sin(y), Math.cos(x) * Math.cos(y));
                    return dir.normalize().multiplyScalar(radius);
                }

                const LOCATIONS = [
                    {
                        id: 'chicago',
                        name: 'Chicago / Gary Metro',
                        role: 'K.E.L.M. 101.9 Radio — HQ',
                        info: 'Foundational base of operations and broadcast origin.',
                        xDeg: -32, yDeg: 18,
                    },
                    {
                        id: 'la',
                        name: 'Los Angeles, Los Feliz',
                        role: 'West Coast Hub',
                        info: 'BRAY Magazine & Digital Streaming production hub.',
                        xDeg: 28, yDeg: -8,
                    },
                    {
                        id: 'london',
                        name: 'London, UK',
                        role: 'International Talent & Q Collaboration',
                        info: 'Featuring collaborator, Stuart Epps.',
                        xDeg: 65, yDeg: 22,
                    },
                ];

                const MARKER_RADIUS = 1.02;
                const markerGroup = new THREE.Group();
                tiltGroup.add(markerGroup);

                // Halo sprite texture (radial glow) shared by all markers
                const haloCanvas = document.createElement('canvas');
                haloCanvas.width = haloCanvas.height = 128;
                const hctx = haloCanvas.getContext('2d');
                const hgrad = hctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                hgrad.addColorStop(0,    'rgba(255, 235, 140, 1)');
                hgrad.addColorStop(0.18, 'rgba(255, 210, 80, 0.95)');
                hgrad.addColorStop(0.40, 'rgba(219, 170, 50, 0.60)');
                hgrad.addColorStop(0.68, 'rgba(180, 130, 20, 0.18)');
                hgrad.addColorStop(1,    'rgba(140, 90, 0, 0)');
                hctx.fillStyle = hgrad;
                hctx.fillRect(0, 0, 128, 128);
                const haloTexture = new THREE.CanvasTexture(haloCanvas);

                // Build a microphone marker: warm gold emissive head + body + grille rings.
                // Slightly larger so the shape reads clearly on the globe surface.
                function buildMicMarker() {
                    const group = new THREE.Group();

                    // Emissive gold — glows warmly like a lit stage mic
                    const goldMat = new THREE.MeshStandardMaterial({
                        color: 0xffe090,
                        emissive: 0xffb930,
                        emissiveIntensity: 1.4,
                        roughness: 0.28,
                        metalness: 0.72,
                    });

                    // Mic head (sphere) — larger so it's clearly visible
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.034, 18, 18), goldMat);
                    head.position.y = 0.030;
                    group.add(head);

                    // Mic body (cylinder beneath head)
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.020, 0.044, 14), goldMat);
                    body.position.y = -0.008;
                    group.add(body);

                    // Grille rings — slightly darker warm gold
                    const ringMat = new THREE.MeshStandardMaterial({
                        color: 0xdba830,
                        emissive: 0xc07010,
                        emissiveIntensity: 0.9,
                        roughness: 0.35,
                        metalness: 0.6,
                    });
                    for (let ri = -1; ri <= 1; ri++) {
                        const torus = new THREE.Mesh(new THREE.TorusGeometry(0.034, 0.0035, 8, 22), ringMat);
                        torus.rotation.x = Math.PI / 2;
                        torus.position.y = 0.030 + ri * 0.014;
                        group.add(torus);
                    }

                    return group;
                }

                LOCATIONS.forEach(loc => {
                    const pos = frontVec3(loc.xDeg, loc.yDeg, MARKER_RADIUS);

                    // Glowing gold mic marker, oriented to point outward from sphere
                    const mic = buildMicMarker();
                    mic.position.copy(pos);
                    mic.lookAt(pos.clone().multiplyScalar(2));
                    mic.rotation.x += Math.PI / 2; // upright relative to surface normal
                    mic.traverse(obj => { if (obj.isMesh) obj.userData.locationId = loc.id; });
                    markerGroup.add(mic);

                    // Big bright halo behind/around the mic (pulses)
                    const haloMat = new THREE.SpriteMaterial({
                        map: haloTexture, transparent: true, depthWrite: false,
                        blending: THREE.AdditiveBlending,
                    });
                    const halo = new THREE.Sprite(haloMat);
                    halo.scale.set(0.26, 0.26, 1);
                    halo.position.copy(pos);
                    halo.userData.locationId = loc.id;
                    halo.userData.isHalo = true;
                    markerGroup.add(halo);

                    // Invisible larger hit-sphere for easier hover/raycast
                    const hitGeo = new THREE.SphereGeometry(0.09, 12, 12);
                    const hitMat = new THREE.MeshBasicMaterial({ visible: false });
                    const hitSphere = new THREE.Mesh(hitGeo, hitMat);
                    hitSphere.position.copy(pos);
                    hitSphere.userData.locationId = loc.id;
                    markerGroup.add(hitSphere);

                    // Outer ring (teal) for hover-highlight feedback
                    const ringGeo = new THREE.RingGeometry(0.034, 0.042, 24);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0x2d8f91, transparent: true, opacity: 0,
                        side: THREE.DoubleSide, depthWrite: false,
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.position.copy(pos);
                    ring.lookAt(pos.clone().multiplyScalar(2));
                    ring.userData.locationId = loc.id;
                    ring.userData.isRing = true;
                    markerGroup.add(ring);

                    loc._core = hitSphere;
                    loc._halo = halo;
                    loc._halo._baseScale = 0.26;
                    loc._ring = ring;
                    loc._pos = pos;
                });

                // ── Glowing golden great-circle arcs between locations ──
                // Two-layer approach: a narrow bright core + a wider soft halo
                // gives the arc a cinematic "neon tube" quality without being
                // garish — the additive blend keeps it luminous on dark areas
                // and naturally transparent over lighter image regions.
                function buildArc(p1, p2) {
                    const group = new THREE.Group();
                    const mid = p1.clone().add(p2).multiplyScalar(0.5);
                    const dist = p1.distanceTo(p2);
                    mid.normalize().multiplyScalar(1 + dist * 0.55);
                    const curve = new THREE.CatmullRomCurve3([
                        p1.clone().multiplyScalar(1.002),
                        mid,
                        p2.clone().multiplyScalar(1.002),
                    ]);

                    // Core: bright, saturated gold — the luminous spine of the arc
                    const coreMat = new THREE.MeshBasicMaterial({
                        color: 0xffe9a0,          // bright warm gold
                        transparent: true,
                        opacity: 0.92,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                    });
                    group.add(new THREE.Mesh(
                        new THREE.TubeGeometry(curve, 64, 0.0032, 8, false),
                        coreMat
                    ));

                    // Halo: wider, softer, deep gold — creates the glow bloom
                    const haloMat = new THREE.MeshBasicMaterial({
                        color: 0xcfb55f,          // deep gold, matches --gold-deep
                        transparent: true,
                        opacity: 0.32,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                    });
                    group.add(new THREE.Mesh(
                        new THREE.TubeGeometry(curve, 64, 0.0110, 6, false),
                        haloMat
                    ));

                    return group;
                }

                const arcGroup = new THREE.Group();
                tiltGroup.add(arcGroup);
                arcGroup.add(buildArc(LOCATIONS[0]._pos, LOCATIONS[1]._pos)); // Chicago - LA
                arcGroup.add(buildArc(LOCATIONS[1]._pos, LOCATIONS[2]._pos)); // LA - London
                arcGroup.add(buildArc(LOCATIONS[2]._pos, LOCATIONS[0]._pos)); // London - Chicago

                // ── Media pillar nodes (small branded glowing spheres) ──
                const PILLARS = [
                    { label: 'K.E.L.M. 101.9 Radio', anchor: LOCATIONS[0], offset: new THREE.Vector3(0.05, 0.06, 0.02), color: 0x2d8f91 },
                    { label: 'BRAY Magazine', anchor: LOCATIONS[1], offset: new THREE.Vector3(-0.05, 0.06, 0.02), color: 0xdbc46d },
                    { label: 'Digital Streaming', anchor: LOCATIONS[1], offset: new THREE.Vector3(0.06, -0.04, 0.04), color: 0x2d8f91 },
                ];
                const pillarGroup = new THREE.Group();
                tiltGroup.add(pillarGroup);
                PILLARS.forEach(p => {
                    const geo = new THREE.SphereGeometry(0.012, 12, 12);
                    const mat = new THREE.MeshBasicMaterial({ color: p.color });
                    const node = new THREE.Mesh(geo, mat);
                    node.position.copy(p.anchor._pos.clone().add(p.offset).normalize().multiplyScalar(MARKER_RADIUS + 0.015));
                    pillarGroup.add(node);

                    const haloMat = new THREE.SpriteMaterial({
                        map: haloTexture, transparent: true, depthWrite: false,
                        blending: THREE.AdditiveBlending, opacity: 0.7,
                        color: p.color,
                    });
                    const halo = new THREE.Sprite(haloMat);
                    halo.scale.set(0.08, 0.08, 1);
                    halo.position.copy(node.position);
                    pillarGroup.add(halo);
                });


                // ── Cinematic lighting rig ────────────────────────────
                // Low ambient keeps shadows dark and dramatic — the key light
                // sculpts the sphere and gives real 3D depth.
                scene.add(new THREE.AmbientLight(0xfff0d8, 0.14));

                // KEY LIGHT — warm ivory-gold, upper-left (classic portrait/product position)
                // Strong enough to create clear light-vs-shadow contrast across the sphere.
                const sun = new THREE.DirectionalLight(0xfff6e8, 3.4);
                sun.position.set(-2.0, 2.2, 2.8);
                scene.add(sun);

                // RIM LIGHT — cool teal edge trace, opposite side of key
                // Creates the cinematic "halo" silhouette confirming depth.
                const rim = new THREE.DirectionalLight(0x4ecfd4, 0.90);
                rim.position.set(2.8, -0.6, -2.2);
                scene.add(rim);

                // FILL LIGHT — very soft warm bounce from below-front
                // Lifts shadow detail just enough without flattening the form.
                const fill = new THREE.DirectionalLight(0xffecc8, 0.22);
                fill.position.set(0.5, -2.5, 1.0);
                scene.add(fill);

                // BACK KICK — teal from behind-top for atmosphere separation
                const kick = new THREE.DirectionalLight(0x2d8f91, 0.20);
                kick.position.set(0, 1.2, -3.0);
                scene.add(kick);

                // SPECULAR POINT — tight warm gold near key side (cinema sparkle / polish)
                // Low radius keeps it local so it creates a visible glossy hotspot.
                const pointGold = new THREE.PointLight(0xffe8b0, 1.8, 3.2);
                pointGold.position.set(-1.2, 1.6, 2.0);
                scene.add(pointGold);

                // SECONDARY POINT — teal-cool fill on the shadow side for depth separation
                const pointCool = new THREE.PointLight(0x3ab8bc, 0.55, 3.8);
                pointCool.position.set(1.8, -1.0, -1.5);
                scene.add(pointCool);

                // ── Particle cloud (floating sparks around globe) ─────
                const sparkCount = 38;
                const sparkPositions = new Float32Array(sparkCount * 3);
                for (let i = 0; i < sparkCount; i++) {
                    const phi = Math.random() * Math.PI * 2;
                    const theta = Math.random() * Math.PI;
                    const r = 1.15 + Math.random() * 0.30;
                    sparkPositions[i * 3] = r * Math.sin(theta) * Math.cos(phi);
                    sparkPositions[i * 3 + 1] = r * Math.cos(theta);
                    sparkPositions[i * 3 + 2] = r * Math.sin(theta) * Math.sin(phi);
                }
                const sparkGeo = new THREE.BufferGeometry();
                sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
                const sparkMat = new THREE.PointsMaterial({
                    color: 0xffe8a0, size: 0.048, transparent: true, opacity: 1,
                    sizeAttenuation: true,
                });
                tiltGroup.add(new THREE.Points(sparkGeo, sparkMat));

                // ── HTML tap-target projection system ──────────────────
                // Each frame we project marker 3D positions to screen coords
                // and move invisible <button> elements over them. This gives
                // reliable click/tap on ALL devices (mobile, desktop, tablet)
                // without any raycasting matrix alignment issues.

                const tapEls = {
                    chicago: document.getElementById('tap-chicago'),
                    la:      document.getElementById('tap-la'),
                    london:  document.getElementById('tap-london'),
                };

                // Modal refs
                const modalOverlay = document.getElementById('location-modal-overlay');
                const modalTitle   = document.getElementById('location-modal-title');
                const modalRole    = document.getElementById('location-modal-role');
                const modalInfo    = document.getElementById('location-modal-info');
                const modalClose   = document.getElementById('location-modal-close');

                let hoveredLoc  = null;   // true hover state (mouseenter/leave)
                let modalIsOpen = false;  // modal open flag
                const tooltipEl    = document.getElementById('globe-tooltip');
                const tooltipTitle = document.getElementById('globe-tooltip-title');
                const tooltipRole  = document.getElementById('globe-tooltip-role');
                const tooltipInfo  = document.getElementById('globe-tooltip-info');

                function openModal(loc) {
                    modalTitle.textContent = loc.name;
                    modalRole.textContent  = loc.role;
                    modalInfo.textContent  = loc.info;
                    modalOverlay.classList.add('is-open');
                    modalIsOpen = true;
                    hideTooltip();
                }

                function closeModal() {
                    modalOverlay.classList.remove('is-open');
                    modalIsOpen = false;
                }

                modalClose.addEventListener('click', closeModal);
                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) closeModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeModal();
                });

                // ── Hover handling with grace period ────────────────────
                // A short delay before resuming after mouseleave prevents
                // the marker (which is still slowing down) from drifting
                // out from under the cursor and causing rapid hover
                // flicker — this is what made clicking feel "jumpy".
                const HOVER_GRACE_MS = 180;
                let hoverClearTimer = null;

                function setHovered(loc) {
                    if (hoverClearTimer) { clearTimeout(hoverClearTimer); hoverClearTimer = null; }
                    if (hoveredLoc && hoveredLoc !== loc) hoveredLoc._ringTarget = 0;
                    hoveredLoc = loc;
                    if (loc) loc._ringTarget = 0.85;
                }

                function clearHovered(loc) {
                    if (hoverClearTimer) clearTimeout(hoverClearTimer);
                    hoverClearTimer = setTimeout(() => {
                        if (hoveredLoc === loc) {
                            hoveredLoc = null;
                            hideTooltip();
                            renderer.domElement.style.cursor = 'default';
                        }
                        if (loc) loc._ringTarget = 0;
                        hoverClearTimer = null;
                    }, HOVER_GRACE_MS);
                }

                // Wire up each tap button to open its modal
                LOCATIONS.forEach(loc => {
                    const btn = tapEls[loc.id];
                    if (!btn) return;
                    loc._ringTarget = 0; // smoothly-faded ring opacity target

                    // Click/tap → modal (works on all devices)
                    btn.addEventListener('click', () => openModal(loc));

                    // Hover → tooltip + rotation slowdown (desktop only)
                    btn.addEventListener('mouseenter', () => {
                        if (btn.style.display === 'none') return;
                        setHovered(loc);
                        const rect = btn.getBoundingClientRect();
                        const sceneRect = (sceneEl || globeEl).getBoundingClientRect();
                        showTooltip(loc, rect.left + rect.width / 2, rect.top, sceneRect);
                        renderer.domElement.style.cursor = 'pointer';
                    });
                    btn.addEventListener('mouseleave', () => {
                        clearHovered(loc);
                    });
                });

                function showTooltip(loc, cx, cy, sceneRect) {
                    tooltipTitle.textContent = loc.name;
                    tooltipRole.textContent  = loc.role;
                    tooltipInfo.textContent  = loc.info;

                    let x = cx - sceneRect.left;
                    let y = cy - sceneRect.top;

                    tooltipEl.classList.remove('tooltip--below');
                    tooltipEl.style.left = x + 'px';
                    tooltipEl.style.top  = y + 'px';
                    tooltipEl.classList.add('is-visible');

                    // Clamp after measuring
                    requestAnimationFrame(() => {
                        const tw = tooltipEl.offsetWidth;
                        const th = tooltipEl.offsetHeight;
                        let nx = Math.max(tw / 2 + 4, Math.min(x, sceneRect.width - tw / 2 - 4));
                        if (y - th - 18 < 0) {
                            tooltipEl.classList.add('tooltip--below');
                        }
                        tooltipEl.style.left = nx + 'px';
                    });
                }

                function hideTooltip() {
                    tooltipEl.classList.remove('is-visible');
                }

                // Project a marker's TRUE 3D world position → 2D scene pixels.
                // Uses Three.js's own matrixWorld (set during renderer.render)
                // so it EXACTLY matches where the mesh appears on screen.
                // renderer.render() must have been called first this frame.
                const _projVec = new THREE.Vector3();
                function projectMarker(loc, sceneW, sceneH) {
                    // Get the actual world position of the hit-sphere mesh
                    loc._core.getWorldPosition(_projVec);

                    // Check if it's on the front hemisphere (dot with camera dir)
                    const camDir = camera.position.clone().normalize();
                    const dot = _projVec.clone().normalize().dot(camDir);
                    if (dot < 0.05) return { px: 0, py: 0, visible: false }; // behind globe

                    // Project to NDC then to pixel space
                    _projVec.project(camera);
                    const px = ( _projVec.x + 1) / 2 * sceneW;
                    const py = (-_projVec.y + 1) / 2 * sceneH;
                    const visible = _projVec.z < 1 && px > 10 && px < sceneW - 10 && py > 10 && py < sceneH - 10;
                    return { px, py, visible };
                }


                function syncSize() {
                    const s = getSize();
                    if (s.w === 0 || s.h === 0) return;
                    renderer.setSize(s.w, s.h);
                    camera.aspect = s.w / s.h;
                    camera.updateProjectionMatrix();
                }

                // Watch the scene container — it has the real layout size
                new ResizeObserver(syncSize).observe(sceneEl || globeEl);

                // Expose for the intro-ready handler to call
                window.__globeSyncSize = syncSize;

                // Double rAF: re-sync after first browser paint when layout is settled
                requestAnimationFrame(() => requestAnimationFrame(syncSize));

                // ── Animation: pendulum / oscillating rotation ────────
                let time = 0;
                let sparkT = 0;
                let rotationFactor = 1;
                let _readyFrames = 0;
                const READY_AFTER = 30;

                function animate() {
                    requestAnimationFrame(animate);
                    const now = performance.now();
                    if (now < window.__globeStartTime) {
                        renderer.render(scene, camera);
                        return;
                    }

                    // Ease rotation: quick near-pause on hover so users can
                    // click markers comfortably, gentle resume afterwards.
                    const target = hoveredLoc ? 0.04 : 1;
                    const ease = hoveredLoc ? 0.35 : 0.05; // fast to slow, gentle to resume
                    rotationFactor += (target - rotationFactor) * ease;

                    time += PENDULUM_SPEED * rotationFactor;
                    sparkT += 0.006;

                    globe.rotation.y      = Math.sin(time) * PENDULUM_SWING;
                    lineGroup.rotation.y  = globe.rotation.y;
                    markerGroup.rotation.y = globe.rotation.y;
                    arcGroup.rotation.y   = globe.rotation.y;
                    pillarGroup.rotation.y = globe.rotation.y;

                    tiltGroup.rotation.x  = Math.sin(time * 0.4) * 0.04;

                    // Gentle vertical float — a slow sine at a prime-ratio frequency
                    // so it never locks in phase with the pendulum. Amplitude is ~2.5%
                    // of the globe radius in world units: perceptible but weightless.
                    tiltGroup.position.y = Math.sin(time * 0.27) * 0.045;

                    sparkMat.opacity = 0.75 + 0.25 * Math.sin(sparkT);

                    // Pulse marker halos + smooth ring fade
                    LOCATIONS.forEach((loc, i) => {
                        const pulse = 1 + 0.22 * Math.sin(sparkT * 1.6 + i * 1.7);
                        const s = loc._halo._baseScale * pulse;
                        loc._halo.scale.set(s, s, 1);

                        // Smoothly lerp ring opacity toward its target
                        const ringTarget = loc._ringTarget || 0;
                        loc._ring.material.opacity += (ringTarget - loc._ring.material.opacity) * 0.2;
                    });

                    sun.position.x = -2.0 + Math.sin(time * 0.18) * 0.35;
                    sun.position.y =  2.2 + Math.cos(time * 0.14) * 0.25;
                    // Subtle gold point light drift for cinematic shimmer
                    pointGold.position.x = -1.2 + Math.sin(time * 0.22) * 0.3;
                    pointGold.position.y =  1.6 + Math.cos(time * 0.17) * 0.2;
                    // Cool secondary point — gentle counter-drift on shadow side
                    pointCool.position.x =  1.8 + Math.sin(time * 0.19 + 1.2) * 0.25;
                    pointCool.position.y = -1.0 + Math.cos(time * 0.15 + 0.8) * 0.18;

                    texture.needsUpdate = (pending === 0);
                    renderer.render(scene, camera);

                    // ── Project marker positions → move HTML tap-targets ──
                    // Run AFTER render so camera matrices are current.
                    const sceneEl2 = sceneEl || globeEl;
                    const sceneW = sceneEl2.offsetWidth;
                    const sceneH = sceneEl2.offsetHeight;

                    LOCATIONS.forEach(loc => {
                        const btn = tapEls[loc.id];
                        if (!btn) return;
                        const { px, py, visible } = projectMarker(loc, sceneW, sceneH);
                        // Only show tap target when marker is on the front hemisphere
                        const onFront = visible && px > 0 && px < sceneW && py > 0 && py < sceneH;
                        btn.style.display = onFront ? 'block' : 'none';
                        btn.style.left = px + 'px';
                        btn.style.top  = py + 'px';
                    });

                    if (_readyFrames < READY_AFTER) {
                        _readyFrames++;
                        if (_readyFrames === READY_AFTER && typeof window.__globeReady === 'function') {
                            window.__globeReady();
                        }
                    }
                }
                window.__globeStartTime = performance.now() + 1500;
                animate();
            }

        })();

    </script>

    <script>
        /* ── Intro sequence controller ───────────────────────────────
         *
         *  Called once by the globe's animation loop after it has
         *  rendered READY_AFTER smooth frames (≈ 30 frames post warm-up).
         *  Nothing on the page is visible until this fires.
         *
         *  The #press-key-hint badge and its click/keydown listeners
         *  have been removed — this is now a pure intro section,
         *  not a page loader.
         * ─────────────────────────────────────────────────────────── */
        window.__globeReady = function () {
            // Prevent double-fire
            window.__globeReady = null;

            // Kick off all CSS animations by adding the class to <body>
            document.body.classList.add('intro-ready');

            // Re-sync the renderer size now that the globe is visible and
            // the CSS transform scale(0.92) is animating to scale(1).
            // We fire syncSize via a small timeout so the layout has
            // fully recalculated with the new class applied.
            if (typeof window.__globeSyncSize === 'function') {
                setTimeout(window.__globeSyncSize, 0);
                setTimeout(window.__globeSyncSize, 100);
                setTimeout(window.__globeSyncSize, 400);
            }
        };
    </script>

</body>

</html>
